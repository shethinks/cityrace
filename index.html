<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Race - Disaster Randomizer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #4104cc;
    margin: 0;
    padding: 10px;
  }

  .card {
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
  }

  h1 { font-size: 2rem; margin: 0 0 10px; }
  h2 { font-size: 1.5rem; margin: 5px 0; }

  button {
    font-size: 1rem;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    cursor: pointer;
    margin-bottom: 12px;
  }

  button:hover { background: #444; }

  .poster-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .poster-controls select, .poster-controls input {
    font: inherit;
    max-width: 100%;
  }

  #posterStatus:empty { display: none; }
  #posterStatus { margin: 0 0 12px; }
  #subhead { margin: 8px 0 12px; line-height: 1.35; }

  #intensity, #position {
    margin: 8px 0;
    font-size: 1.1rem;
    font-weight: bold;
  }

  #intensity:empty, #position:empty { display: none; }

  #mapFrame {
    box-sizing: border-box;
    position: relative;
    display: inline-block;
    max-width: 100%;
    margin: 10px auto 0;
    border: 2px solid #333;
    vertical-align: top;
  }

  #mapImage {
    display: block;
    max-width: 100%;
    max-height: 280px;
  }

  #posterGrid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template: repeat(4, minmax(0, 1fr)) / repeat(4, minmax(0, 1fr));
    pointer-events: none;
  }

  #mapFrame[hidden], #posterGrid[hidden] { display: none; }

  #posterGrid span {
    border-right: 1px solid #222;
    border-bottom: 1px solid #222;
    box-shadow: inset -1px -1px rgba(255, 255, 255, .55);
  }

  #posterGrid span:nth-child(4n) { border-right: 0; }
  #posterGrid span:nth-last-child(-n+4) { border-bottom: 0; }

  #posterGrid .affected {
    background: rgba(255, 145, 0, .42);
    box-shadow: inset 0 0 0 2px #6b3300, inset 0 0 0 4px #ffbf52;
  }
</style>
</head>
<body>
<div class="card">
  <h1>City Race</h1>

  <div class="poster-controls">
    <label for="posterSelect">Poster</label>
    <select id="posterSelect">
      <option value="">Original poster</option>
    </select>
    <label for="posterUpload">Upload poster image</label>
    <input id="posterUpload" type="file" accept="image/*" disabled>
  </div>
  <p id="posterStatus" role="status"></p>

  <button id="rollButton" type="button">DISASTER STRIKES!!</button>
  <h2 id="headline">Press the button</h2>
  <div id="subhead"></div>
  <div id="intensity"></div>
  <div id="position"></div>
  <div id="mapFrame" hidden>
    <img id="mapImage" alt="">
    <div id="posterGrid" aria-hidden="true" hidden></div>
  </div>
</div>

<script>
const disasters = [
  {
    headline: "Tornado",
    subhead: "Oh no! Mother nature has sucked you up and moved you backwards twice the number of spaces as the intensity rating. You are hit if you are in the disaster square or any square south of the square. Fortunately, your car is not damaged...phewww!",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Alien Abduction",
    subhead: "Is there life beyond our planet? Yup, and if you're in the disaster square, you're an extraterrestrial now too cause you're not on earth anymore. Little green aliens are beaming you aboard their flying saucer for study. How intense is their research? It just depends. An intensity of one means you're not that fascinating and they only keep you aboard for your next turn. Two and you lose two turns. Three means you lose three turns, but at least you're super interesting.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Hurricane",
    subhead: "That breeze sure feels great. Gosh, it's picking up. Is that a flying cow?!?! Take cover! If you're in the disaster square, that's the eye of the storm and you're fine. If you're adjacent to the eye, you get blown backwards the twice the number of spaces as the intensity rating. Everyone else on the board gets blown backward 1 times the number of spaces as the intensity rating.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Earthquake",
    subhead: "Woah, the earth is shaking. Sometimes you don't feel earthquakes when you drive in cars...not this time. You sustain damage according to the intensity. Count how many squares away you are from the epicenter and subtract one for each orthogonal space to see your damage.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Fire",
    subhead: "Who left the stove on? All players roll and whoever rolls the lowest is the guilty party. Fire starts in your square. If you're in the space (regardless of whether you started the fire), your car is damaged by 2. If you are in an adjacent square, you must go to the nearest hospital for smoke inhalation, whether it's in front or behind you. You may not go to a hospital in the fire square.",
    staticImage: "mapgrid.jpg"
  },
  {
    headline: "Lightning",
    subhead: "Look out! Lightning strikes! If it's a level one, it's beautiful, enjoy nature's majesty. Level 2 starts a fire. But it's slow. Anybody in the strike zone has the opportunity to roll and get away. If you can move 3 or more spaces, you're safe. If you don't move far enough or it's a level 3, you're damaged by 1.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Volcanic Eruption",
    subhead: "Isn't earth majestic? She's also hot and she's melting your tires. You sustain damage according to the intensity.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Tsunami",
    subhead: "If you're in a square with water or a square adjacent to water, you get washed down to the water spot earliest in the game. You cannot move forward.",
    staticImage: "mapgrid.jpg"
  }
];

const posterSelect = document.getElementById("posterSelect");
const posterUpload = document.getElementById("posterUpload");
const posterStatus = document.getElementById("posterStatus");
const mapFrame = document.getElementById("mapFrame");
const posterGrid = document.getElementById("posterGrid");
const gridSquares = Array.from({ length: 16 }, () => document.createElement("span"));
posterGrid.append(...gridSquares);
const mapImage = document.getElementById("mapImage");
const positionLabel = document.getElementById("position");
const posters = new Map();
const selectionKey = "city-race-selected-poster";
let database;
let currentRoll;
let posterUrl;

function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function renderPoster() {
  const oldUrl = posterUrl;
  const poster = posters.get(posterSelect.value);
  posterUrl = poster ? URL.createObjectURL(poster.file) : undefined;
  const position = currentRoll?.position;
  const originalImage = position ? "mapgrid.jpg" : currentRoll?.disaster.staticImage;
  const source = posterUrl || originalImage;

  positionLabel.textContent = position ? `Disaster square: ${position}` : "";
  mapFrame.hidden = !source;
  posterGrid.hidden = !source;
  gridSquares.forEach((square, index) => {
    square.classList.toggle("affected", index + 1 === position);
  });
  if (source) {
    mapImage.alt = poster ? `Poster: ${poster.file.name}` : position ? `Disaster Position ${position}` : "Map Grid";
    mapImage.src = source;
  } else {
    mapImage.removeAttribute("src");
  }
  if (oldUrl) URL.revokeObjectURL(oldUrl);
}

function rollDisaster() {
  const disaster = disasters[randomNumber(0, disasters.length - 1)];
  const intensity = disaster.useIntensity ? randomNumber(1, 3) : null;
  const position = disaster.useRandomPosition ? randomNumber(1, 16) : null;

  currentRoll = { disaster, position };
  document.getElementById("headline").textContent = disaster.headline;
  document.getElementById("subhead").textContent = disaster.subhead;
  document.getElementById("intensity").textContent = intensity ? `Intensity: ${intensity}` : "";
  renderPoster();
}

function addPoster(poster) {
  const id = String(poster.id);
  posters.set(id, poster);
  posterSelect.add(new Option(poster.file.name, id));
}

function rememberSelection() {
  renderPoster();
  try {
    localStorage.setItem(selectionKey, posterSelect.value);
  } catch {
    posterStatus.textContent = "The selected poster could not be remembered in this browser.";
  }
}

async function loadPosters() {
  try {
    database = await new Promise((resolve, reject) => {
      const request = indexedDB.open("city-race-posters", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("posters", { keyPath: "id", autoIncrement: true });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error("Poster storage is blocked"));
    });
    const saved = await new Promise((resolve, reject) => {
      const request = database.transaction("posters").objectStore("posters").getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    saved.forEach(addPoster);
  } catch {
    posterStatus.textContent = "Saved posters are unavailable. You can still use the original poster.";
    return;
  }

  try {
    const selectedId = localStorage.getItem(selectionKey);
    if (posters.has(selectedId)) posterSelect.value = selectedId;
  } catch {
    posterStatus.textContent = "The previous poster selection is unavailable.";
  }
  posterUpload.disabled = false;
  renderPoster();
}

async function uploadPoster() {
  const file = posterUpload.files[0];
  if (!file) return;

  posterUpload.disabled = true;
  posterStatus.textContent = "";
  const previewUrl = URL.createObjectURL(file);
  try {
    const preview = new Image();
    preview.src = previewUrl;
    await preview.decode();
  } catch {
    posterStatus.textContent = "This file could not be opened as an image. Try a JPG or PNG.";
    posterUpload.disabled = false;
    return;
  } finally {
    URL.revokeObjectURL(previewUrl);
    posterUpload.value = "";
  }

  try {
    const id = await new Promise((resolve, reject) => {
      const transaction = database.transaction("posters", "readwrite");
      const request = transaction.objectStore("posters").add({ file });
      transaction.oncomplete = () => resolve(request.result);
      transaction.onabort = () => reject(transaction.error);
    });
    addPoster({ id, file });
    posterSelect.value = String(id);
    posterStatus.textContent = "Poster saved in this browser.";
    rememberSelection();
  } catch {
    posterStatus.textContent = "The poster could not be saved in this browser.";
  } finally {
    posterUpload.disabled = false;
  }
}

document.getElementById("rollButton").addEventListener("click", rollDisaster);
posterSelect.addEventListener("change", rememberSelection);
posterUpload.addEventListener("change", uploadPoster);
loadPosters();
</script>
</body>
</html>
