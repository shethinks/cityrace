<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Race - Disaster Randomizer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #4104cc;
    margin: 0;
    padding: 10px;
  }

  .card {
    background: white;
    box-sizing: border-box;
    max-width: 1120px;
    margin: auto;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 2.75rem);
    line-height: 1.05;
    letter-spacing: -.035em;
  }

  h2 { margin: 0; font-size: 1.15rem; }

  button, input, select { font: inherit; }

  button {
    padding: 9px 14px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: #35128a;
    color: white;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: #4920ad; }
  button:disabled { opacity: .5; cursor: default; }

  .game-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 290px);
    align-items: start;
    gap: 24px;
    text-align: left;
    color: #231838;
  }

  .game-title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  #rollButton {
    background: #4104cc;
    font-weight: 700;
  }

  #rollButton:hover { background: #3410a0; }

  .poster-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
  }

  .poster-controls label, .timer form label {
    min-width: 0;
    font-size: .875rem;
    font-weight: 700;
    color: #493d5d;
  }

  .poster-controls select, .poster-controls input, .timer input, .timer select {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 38px;
    margin-top: 5px;
    padding: 6px 8px;
    border: 1px solid #d8cfe6;
    border-radius: 7px;
    background: white;
    color: #231838;
    font-weight: 400;
  }

  .poster-controls input::file-selector-button {
    margin-right: 8px;
    padding: 3px 8px;
    border: 0;
    border-radius: 4px;
    background: #ede5ff;
    color: #35128a;
    font: inherit;
  }

  .result {
    margin-top: 14px;
    padding: 12px 14px;
    border-left: 3px solid #7146d0;
    border-radius: 0 8px 8px 0;
    background: #f7f4fc;
  }

  .result-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #subhead { margin-top: 6px; line-height: 1.5; }
  #subhead:empty, #intensity:empty, #position:empty { display: none; }

  #intensity, #position {
    margin-top: 8px;
    padding: 4px 8px;
    border-radius: 5px;
    background: #ebe3fa;
    font-size: .875rem;
    font-weight: 700;
  }

  .timer-panel {
    padding: 14px;
    border: 1px solid #ded8ec;
    border-radius: 12px;
    background: #faf8ff;
  }

  .timer summary { cursor: pointer; font-size: 1.15rem; font-weight: 700; }

  .timer form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .timer form label:first-child, #durationLabel, .timer-actions { grid-column: 1 / -1; }

  .timer-actions { display: flex; gap: 8px; }
  #timerStop { border-color: #ded8ec; background: white; color: #35128a; }
  #timerStop:hover:not(:disabled) { background: #ede5ff; }

  #timerDisplay, #timerStatus, #posterStatus { margin: 8px 0 0; }
  #timerDisplay {
    color: #b91c1c;
    font-size: clamp(2.75rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  #timerDisplay.random-armed {
    animation: alarm-pulse 1.4s ease-in-out infinite;
  }

  @keyframes alarm-pulse {
    50% { opacity: .45; }
  }

  @media (prefers-reduced-motion: reduce) {
    #timerDisplay.random-armed { animation: none; }
  }

  #timerStatus, #posterStatus { font-size: .875rem; }
  #timerDisplay:empty, #timerStatus:empty, #posterStatus:empty { display: none; }

  @media (max-width: 680px) {
    .game-header { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  }

  @media (max-width: 420px) {
    .poster-controls { grid-template-columns: minmax(0, 1fr); }
  }

  #mapFrame {
    box-sizing: border-box;
    position: relative;
    margin: 16px auto 0;
    border: 2px solid #333;
  }

  #mapImage {
    display: block;
    width: 100%;
    height: auto;
  }

  #posterGrid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template: repeat(4, minmax(0, 1fr)) / repeat(4, minmax(0, 1fr));
    pointer-events: none;
  }

  #mapFrame[hidden], #posterGrid[hidden] { display: none; }

  #posterGrid span {
    border-right: 1px solid #222;
    border-bottom: 1px solid #222;
    box-shadow: inset -1px -1px rgba(255, 255, 255, .55);
  }

  #posterGrid span:nth-child(4n) { border-right: 0; }
  #posterGrid span:nth-last-child(-n+4) { border-bottom: 0; }

  #posterGrid .affected {
    background: rgba(255, 145, 0, .42);
    box-shadow: inset 0 0 0 2px #6b3300, inset 0 0 0 4px #ffbf52;
  }
</style>
</head>
<body>
<div class="card">
  <div class="game-header">
    <div>
      <div class="game-title-row">
        <h1>City Race</h1>
        <button id="rollButton" type="button">DISASTER STRIKES!!</button>
      </div>

      <div class="poster-controls">
        <label>Poster
          <select id="posterSelect">
            <option value="">Original poster</option>
          </select>
        </label>
        <label>Upload poster image
          <input id="posterUpload" type="file" accept="image/*" disabled>
        </label>
      </div>
      <p id="posterStatus" role="status"></p>

      <div id="disasterResult" class="result" hidden>
        <h2 id="headline"></h2>
        <div id="subhead"></div>
        <div class="result-meta">
          <div id="intensity"></div>
          <div id="position"></div>
        </div>
      </div>
    </div>

    <section class="timer-panel" aria-label="Game timer">
      <details class="timer" open>
        <summary>Timer</summary>
        <form id="timerForm">
          <label>Mode
            <select id="timerMode">
              <option value="countdown">Countdown</option>
              <option value="random">Random alarm</option>
            </select>
          </label>
          <label id="durationLabel">Minutes
            <input id="timerDuration" type="number" min="0.02" max="1440" step="any" value="5" required>
          </label>
          <label id="minimumLabel" hidden>Earliest (min)
            <input id="timerMinimum" type="number" min="0.02" max="1440" step="any" value="2" required disabled>
          </label>
          <label id="maximumLabel" hidden>Latest (min)
            <input id="timerMaximum" type="number" min="0.02" max="1440" step="any" value="5" required disabled>
          </label>
          <div class="timer-actions">
            <button id="timerStart" type="submit">Start</button>
            <button id="timerStop" type="button" disabled>Stop</button>
          </div>
        </form>
      </details>
      <p id="timerDisplay" role="timer"></p>
      <p id="timerStatus" role="status"></p>
    </section>
  </div>
  <div id="mapFrame" hidden>
    <img id="mapImage" alt="">
    <div id="posterGrid" aria-hidden="true" hidden></div>
  </div>
</div>

<script>
const disasters = [
  {
    headline: "Tornado",
    subhead: "Oh no! Mother nature has sucked you up and moved you backwards twice the number of spaces as the intensity rating. You are hit if you are in the disaster square or any square south of the square. Fortunately, your car is not damaged...phewww!",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Alien Abduction",
    subhead: "Is there life beyond our planet? Yup, and if you're in the disaster square, you're an extraterrestrial now too cause you're not on earth anymore. Little green aliens are beaming you aboard their flying saucer for study. How intense is their research? It just depends. An intensity of one means you're not that fascinating and they only keep you aboard for your next turn. Two and you lose two turns. Three means you lose three turns, but at least you're super interesting.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Hurricane",
    subhead: "That breeze sure feels great. Gosh, it's picking up. Is that a flying cow?!?! Take cover! If you're in the disaster square, that's the eye of the storm and you're fine. If you're adjacent to the eye, you get blown backwards the twice the number of spaces as the intensity rating. Everyone else on the board gets blown backward 1 times the number of spaces as the intensity rating.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Earthquake",
    subhead: "Woah, the earth is shaking. Sometimes you don't feel earthquakes when you drive in cars...not this time. You sustain damage according to the intensity. Count how many squares away you are from the epicenter and subtract one for each orthogonal space to see your damage.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Fire",
    subhead: "Who left the stove on? All players roll and whoever rolls the lowest is the guilty party. Fire starts in your square. If you're in the space (regardless of whether you started the fire), your car is damaged by 2. If you are in an adjacent square, you must go to the nearest hospital for smoke inhalation, whether it's in front or behind you. You may not go to a hospital in the fire square."
  },
  {
    headline: "Lightning",
    subhead: "Look out! Lightning strikes! If it's a level one, it's beautiful, enjoy nature's majesty. Level 2 starts a fire. But it's slow. Anybody in the strike zone has the opportunity to roll and get away. If you can move 3 or more spaces, you're safe. If you don't move far enough or it's a level 3, you're damaged by 1.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Volcanic Eruption",
    subhead: "Isn't earth majestic? She's also hot and she's melting your tires. You sustain damage according to the intensity.",
    useIntensity: true,
    useRandomPosition: true
  },
  {
    headline: "Tsunami",
    subhead: "If you're in a square with water or a square adjacent to water, you get washed down to the water spot earliest in the game. You cannot move forward."
  }
];

const posterSelect = document.getElementById("posterSelect");
const posterUpload = document.getElementById("posterUpload");
const posterStatus = document.getElementById("posterStatus");
const mapFrame = document.getElementById("mapFrame");
const posterGrid = document.getElementById("posterGrid");
const gridSquares = Array.from({ length: 16 }, () => document.createElement("span"));
posterGrid.append(...gridSquares);
const mapImage = document.getElementById("mapImage");
const positionLabel = document.getElementById("position");
const posters = new Map();
const selectionKey = "city-race-selected-poster";
let database;
let currentRoll;
let posterUrl;

function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function renderPoster() {
  const oldUrl = posterUrl;
  const poster = posters.get(posterSelect.value);
  posterUrl = poster ? URL.createObjectURL(poster.file) : undefined;
  const position = currentRoll?.position;
  const source = posterUrl || "mapgrid.jpg";

  positionLabel.textContent = position ? `Disaster square: ${position}` : "";
  mapFrame.hidden = false;
  posterGrid.hidden = false;
  gridSquares.forEach((square, index) => {
    square.classList.toggle("affected", index + 1 === position);
  });
  mapImage.alt = poster ? `Poster: ${poster.file.name}` : "Map Grid";
  mapImage.src = source;
  if (oldUrl) URL.revokeObjectURL(oldUrl);
}

function rollDisaster() {
  const disaster = disasters[randomNumber(0, disasters.length - 1)];
  const intensity = disaster.useIntensity ? randomNumber(1, 3) : null;
  const position = disaster.useRandomPosition ? randomNumber(1, 16) : null;

  currentRoll = { position };
  document.getElementById("disasterResult").hidden = false;
  document.getElementById("headline").textContent = disaster.headline;
  document.getElementById("subhead").textContent = disaster.subhead;
  document.getElementById("intensity").textContent = intensity ? `Intensity: ${intensity}` : "";
  renderPoster();
}

function addPoster(poster) {
  const id = String(poster.id);
  posters.set(id, poster);
  posterSelect.add(new Option(poster.file.name, id));
}

function rememberSelection() {
  renderPoster();
  try {
    localStorage.setItem(selectionKey, posterSelect.value);
  } catch {
    posterStatus.textContent = "The selected poster could not be remembered in this browser.";
  }
}

async function loadPosters() {
  try {
    database = await new Promise((resolve, reject) => {
      const request = indexedDB.open("city-race-posters", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("posters", { keyPath: "id", autoIncrement: true });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error("Poster storage is blocked"));
    });
    const saved = await new Promise((resolve, reject) => {
      const request = database.transaction("posters").objectStore("posters").getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    saved.forEach(addPoster);
  } catch {
    posterStatus.textContent = "Saved posters are unavailable. You can still use the original poster.";
    return;
  }

  try {
    const selectedId = localStorage.getItem(selectionKey);
    if (posters.has(selectedId)) posterSelect.value = selectedId;
  } catch {
    posterStatus.textContent = "The previous poster selection is unavailable.";
  }
  posterUpload.disabled = false;
  renderPoster();
}

async function uploadPoster() {
  const file = posterUpload.files[0];
  if (!file) return;

  posterUpload.disabled = true;
  posterStatus.textContent = "";
  const previewUrl = URL.createObjectURL(file);
  try {
    const preview = new Image();
    preview.src = previewUrl;
    await preview.decode();
  } catch {
    posterStatus.textContent = "This file could not be opened as an image. Try a JPG or PNG.";
    posterUpload.disabled = false;
    return;
  } finally {
    URL.revokeObjectURL(previewUrl);
    posterUpload.value = "";
  }

  try {
    const id = await new Promise((resolve, reject) => {
      const transaction = database.transaction("posters", "readwrite");
      const request = transaction.objectStore("posters").add({ file });
      transaction.oncomplete = () => resolve(request.result);
      transaction.onabort = () => reject(transaction.error);
    });
    addPoster({ id, file });
    posterSelect.value = String(id);
    posterStatus.textContent = "Poster saved in this browser.";
    rememberSelection();
  } catch {
    posterStatus.textContent = "The poster could not be saved in this browser.";
  } finally {
    posterUpload.disabled = false;
  }
}

const timerForm = document.getElementById("timerForm");
const timerMode = document.getElementById("timerMode");
const timerDuration = document.getElementById("timerDuration");
const timerMinimum = document.getElementById("timerMinimum");
const timerMaximum = document.getElementById("timerMaximum");
const timerStart = document.getElementById("timerStart");
const timerStop = document.getElementById("timerStop");
const timerDisplay = document.getElementById("timerDisplay");
const timerStatus = document.getElementById("timerStatus");
let timerInterval;
let alarmAudio;
let activeAlarm;

function updateTimerInputs() {
  const random = timerMode.value === "random";
  timerDuration.disabled = random;
  timerMinimum.disabled = !random;
  timerMaximum.disabled = !random;
  document.getElementById("durationLabel").hidden = random;
  document.getElementById("minimumLabel").hidden = !random;
  document.getElementById("maximumLabel").hidden = !random;
  timerMaximum.setCustomValidity("");
}

function stopTimer() {
  clearInterval(timerInterval);
  timerStart.disabled = false;
  timerStop.disabled = true;
  timerMode.disabled = false;
  timerDisplay.textContent = "";
  timerDisplay.classList.remove("random-armed");
}

function playAlarm() {
  if (alarmAudio?.state !== "running") return false;

  const start = alarmAudio.currentTime;
  const duration = 20;
  const end = start + duration;
  const tone = alarmAudio.createOscillator();
  const volume = alarmAudio.createGain();
  volume.gain.setValueAtTime(0, start);

  tone.type = "triangle";
  tone.frequency.setValueAtTime(480, start);
  volume.gain.linearRampToValueAtTime(0.65, start + 0.07);
  volume.gain.setValueAtTime(0.65, end - 0.15);
  volume.gain.linearRampToValueAtTime(0, end);
  for (let second = 0; second < duration; second++) {
    tone.frequency.linearRampToValueAtTime(1050, start + second + 0.5);
    tone.frequency.linearRampToValueAtTime(480, start + second + 1);
  }

  tone.connect(volume);
  volume.connect(alarmAudio.destination);
  activeAlarm = tone;
  tone.onended = () => {
    tone.disconnect();
    volume.disconnect();
    if (activeAlarm === tone) {
      activeAlarm = undefined;
      stopTimer();
    }
  };
  tone.start(start);
  tone.stop(end);
  return true;
}

timerMode.addEventListener("change", updateTimerInputs);
timerMinimum.addEventListener("input", () => timerMaximum.setCustomValidity(""));
timerMaximum.addEventListener("input", () => timerMaximum.setCustomValidity(""));
timerForm.addEventListener("submit", event => {
  event.preventDefault();
  const random = timerMode.value === "random";
  if (random && timerMinimum.valueAsNumber > timerMaximum.valueAsNumber) {
    timerMaximum.setCustomValidity("Latest must be at or after earliest.");
    timerMaximum.reportValidity();
    return;
  }

  try {
    alarmAudio ??= new AudioContext();
    alarmAudio.resume().catch(() => {});
  } catch {
    // The visual alarm still works when audio is unavailable.
  }

  const seconds = random
    ? randomNumber(Math.round(timerMinimum.valueAsNumber * 60), Math.round(timerMaximum.valueAsNumber * 60))
    : Math.round(timerDuration.valueAsNumber * 60);
  const deadline = Date.now() + seconds * 1000;
  timerStart.disabled = true;
  timerStop.disabled = false;
  timerMode.disabled = true;
  timerDisplay.classList.toggle("random-armed", random);
  if (random) timerDisplay.textContent = "?";
  timerStatus.textContent = random ? "Random alarm armed" : "Countdown started.";

  function tick() {
    const remaining = Math.ceil((deadline - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerDisplay.classList.remove("random-armed");
      timerDisplay.textContent = random ? "" : "0:00";
      timerStatus.textContent = random ? "Random alarm! Time’s up." : "Time’s up!";
      if (!playAlarm()) stopTimer();
    } else if (!random) {
      const minutes = Math.floor(remaining / 60);
      timerDisplay.textContent = `${minutes}:${String(remaining % 60).padStart(2, "0")}`;
    }
  }

  timerInterval = setInterval(tick, 200);
  tick();
});
timerStop.addEventListener("click", () => {
  const wasSounding = Boolean(activeAlarm);
  if (activeAlarm) {
    const tone = activeAlarm;
    activeAlarm = undefined;
    tone.stop();
  }
  stopTimer();
  timerStatus.textContent = wasSounding ? "Alarm stopped." : "Timer stopped.";
});

document.getElementById("rollButton").addEventListener("click", rollDisaster);
posterSelect.addEventListener("change", rememberSelection);
posterUpload.addEventListener("change", uploadPoster);
renderPoster();
loadPosters();
</script>
</body>
</html>
